<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行共編</title>
<style>
  :root {
    --bg: #f6f3ee;
    --surface: #ffffff;
    --surface-2: #faf8f4;
    --text: #2b2a28;
    --muted: #8a857c;
    --line: #e7e1d7;
    --accent: #e0703a;
    --accent-soft: #fbe9df;
    --ok: #3f9b6e;
    --ok-soft: #e1f2e9;
    --warn: #c98a1b;
    --warn-soft: #fbf0d9;
    --danger: #d0493f;
    --c-transport: #4a8fd6;
    --c-sight: #3f9b6e;
    --c-food: #e0703a;
    --c-stay: #8a63c9;
    --c-other: #8a857c;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(60, 50, 30, .06), 0 4px 16px rgba(60, 50, 30, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --surface: #262522;
      --surface-2: #2e2c29;
      --text: #efebe4;
      --muted: #a39d92;
      --line: #3a3834;
      --accent: #f08a55;
      --accent-soft: #3d2b21;
      --ok: #5cc08f;
      --ok-soft: #22352b;
      --warn: #e2a948;
      --warn-soft: #3a3020;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(150px + env(safe-area-inset-bottom));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* Header */
  .hero {
    padding: 28px 16px 20px;
    background: linear-gradient(135deg, var(--accent) 0%, #f2a65a 100%);
    color: #fff;
  }
  .hero-inner, .main { max-width: 720px; margin: 0 auto; }
  .hero h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .hero .dates { opacity: .9; margin-top: 4px; font-size: 14px; }
  .hero-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .me {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.2); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 14px;
  }
  .me select {
    background: rgba(255,255,255,.95); color: #2b2a28; border: 0; border-radius: 999px; padding: 4px 10px;
  }
  .sync { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 6px; }
  .sync button { background: rgba(255,255,255,.2); border: 0; color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; }

  .main { padding: 16px; }

  /* Tabs (bottom nav) */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs-inner { display: flex; width: 100%; max-width: 720px; }
  .tab {
    flex: 1; background: none; border: 0; padding: 10px 0 12px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px;
  }
  .tab .ic { font-size: 20px; line-height: 1; }
  .tab.active { color: var(--accent); font-weight: 600; }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 12px; }
  .section-title h2 { margin: 0; font-size: 18px; }
  .section-title .hint { color: var(--muted); font-size: 13px; }

  /* Timeline */
  .day { margin-bottom: 22px; }
  .day-head {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
  }
  .day-badge { background: var(--text); color: var(--bg); border-radius: 10px; padding: 2px 10px; font-weight: 700; font-size: 13px; }
  .day-date { font-weight: 600; }
  .day-count { color: var(--muted); font-size: 13px; margin-left: auto; }
  .day-add { background: none; border: 1px dashed var(--line); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 13px; }

  .tl { position: relative; padding-left: 64px; }
  .tl::before { content: ""; position: absolute; left: 55px; top: 6px; bottom: 6px; width: 2px; background: var(--line); border-radius: 2px; }
  .ev { position: relative; margin-bottom: 10px; }
  .ev-time { position: absolute; left: -64px; width: 44px; text-align: right; top: 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ev-time small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .ev-dot { position: absolute; left: -14px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--cat, var(--c-other)); box-shadow: 0 0 0 3px var(--bg); }
  .ev-card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 14px; border-left: 4px solid var(--cat, var(--c-other)); cursor: pointer;
    transition: transform .1s ease;
  }
  .ev-card:active { transform: scale(.99); }
  .ev.tentative .ev-card { border-left-style: dashed; background: var(--surface-2); }
  .ev-top { display: flex; align-items: flex-start; gap: 8px; }
  .ev-title { font-weight: 650; font-size: 16px; flex: 1; word-break: break-word; }
  .chip { display: inline-block; font-size: 12px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .chip.cat { background: color-mix(in srgb, var(--cat, var(--c-other)) 15%, transparent); color: var(--cat, var(--c-other)); }
  .chip.tent { background: var(--warn-soft); color: var(--warn); }
  .ev-loc { margin-top: 4px; font-size: 14px; }
  .ev-loc a { color: var(--accent); text-decoration: none; }
  .ev-note { margin-top: 4px; color: var(--muted); font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .ev-meta { margin-top: 6px; color: var(--muted); font-size: 12px; }

  .empty {
    text-align: center; color: var(--muted); padding: 40px 16px; background: var(--surface);
    border-radius: var(--radius); border: 1px dashed var(--line);
  }

  .day-route { background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; text-decoration: none; }

  /* Candidates */
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .filters button.on { background: var(--text); border-color: var(--text); color: var(--bg); }
  .cand { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px; border-left: 4px solid var(--cat, var(--c-other)); }
  .cand-rank { font-size: 12px; color: var(--muted); font-weight: 600; margin-right: 2px; }
  .cand-link { margin-top: 4px; font-size: 13px; }
  .cand-link a { color: var(--muted); }
  .cand-foot { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .vote { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .vote.up.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .vote.down.on { background: #fbe3e1; border-color: var(--danger); color: var(--danger); font-weight: 700; }
  .voters { font-size: 12px; color: var(--muted); flex: 1; min-width: 80px; }
  .cand-actions { display: flex; gap: 6px; margin-left: auto; }
  .mini { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 6px; }
  .mini.go { background: var(--accent); color: #fff; border-radius: 999px; padding: 4px 12px; font-weight: 600; }

  /* Expenses */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; }
  .people { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .people th, .people td { padding: 8px 4px; text-align: right; border-bottom: 1px solid var(--line); font-size: 14px; }
  .people th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .people th:first-child, .people td:first-child { text-align: left; }
  .people tr:last-child td { border-bottom: 0; }
  .pos { color: var(--ok); font-weight: 600; }
  .neg { color: var(--danger); font-weight: 600; }

  .settle { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; margin-bottom: 8px; }
  .settle .arrow { color: var(--muted); }
  .settle .amt { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .avatar {
    display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; flex: none;
  }

  .exp { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .exp:last-child { border-bottom: 0; }
  .exp-main { flex: 1; min-width: 0; }
  .exp-item { font-weight: 600; word-break: break-word; }
  .exp-sub { color: var(--muted); font-size: 13px; }
  .exp-amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .exp-amt small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }

  /* Settings */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { min-height: 72px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .help { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.danger { background: none; color: var(--danger); padding-left: 0; }
  .btn:disabled { opacity: .5; }

  .fab {
    position: fixed; right: max(16px, calc(50% - 344px)); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 21;
    width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
    font-size: 28px; box-shadow: 0 6px 20px rgba(224,112,58,.4);
  }

  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 14px;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Modal */
  .backdrop {
    position: fixed; inset: 0; background: rgba(20,15,10,.45); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    animation: up .18s ease-out;
  }
  @media (min-width: 640px) {
    .backdrop { align-items: center; }
    .sheet { border-radius: 20px; }
  }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; }
  .sheet-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .sheet-actions .spacer { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 60;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1 id="tripName">旅行共編</h1>
      <div class="dates" id="tripDates"></div>
      <div class="hero-row">
        <label class="me">我是
          <select id="meSelect" aria-label="選擇你的名字"></select>
        </label>
        <div class="sync"><span id="syncText">載入中…</span><button id="refreshBtn" type="button">重新整理</button></div>
      </div>
    </div>
  </header>

  <main class="main">
    <div id="loading" class="loading">資料載入中…</div>
    <section id="view-itinerary" class="hidden"></section>
    <section id="view-candidates" class="hidden"></section>
    <section id="view-expenses" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
  </main>

  <button class="fab" id="fab" type="button" aria-label="新增">＋</button>

  <nav class="tabs">
    <div class="tabs-inner">
      <button class="tab active" data-tab="itinerary" type="button"><span class="ic">🗓️</span>行程</button>
      <button class="tab" data-tab="candidates" type="button"><span class="ic">📌</span>候選</button>
      <button class="tab" data-tab="expenses" type="button"><span class="ic">💰</span>分攤</button>
      <button class="tab" data-tab="settings" type="button"><span class="ic">⚙️</span>設定</button>
    </div>
  </nav>

  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>

<script>
(function () {
  'use strict';

  var CATEGORIES = [
    { key: 'transport', label: '交通', icon: '🚆', color: 'var(--c-transport)' },
    { key: 'sight', label: '景點', icon: '📍', color: 'var(--c-sight)' },
    { key: 'food', label: '餐廳', icon: '🍜', color: 'var(--c-food)' },
    { key: 'stay', label: '住宿', icon: '🏨', color: 'var(--c-stay)' },
    { key: 'other', label: '其他', icon: '✨', color: 'var(--c-other)' }
  ];
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var POLL_MS = 30000;

  var state = { settings: {}, itinerary: [], expenses: [], candidates: [], candFilter: 'all', tab: 'itinerary', modalOpen: false, busy: false };

  /* ---------- 後端呼叫（在 Apps Script 內用 google.script.run；本機預覽用 localStorage 模擬） ---------- */
  var api = (typeof google !== 'undefined' && google.script && google.script.run) ? remoteApi() : mockApi();

  function remoteApi() {
    function call(fn, args) {
      return new Promise(function (resolve, reject) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        r[fn].apply(r, args);
      });
    }
    return {
      getData: function () { return call('getData', []); },
      saveItem: function (t, i) { return call('saveItem', [t, i]); },
      deleteItem: function (t, id) { return call('deleteItem', [t, id]); },
      saveSettings: function (s) { return call('saveSettings', [s]); },
      vote: function (id, name, v) { return call('vote', [id, name, v]); },
      scheduleCandidate: function (id, ev) { return call('scheduleCandidate', [id, ev]); }
    };
  }

  function mockApi() {
    var KEY = 'trip-planner-mock';
    function load() {
      try {
        var d = JSON.parse(localStorage.getItem(KEY));
        if (d) return d;
      } catch (e) {}
      return {
        settings: { tripName: '我們的旅行（本機預覽）', startDate: '', endDate: '', members: '成員A,成員B,成員C,成員D', currency: 'TWD' },
        itinerary: [], expenses: [], candidates: []
      };
    }
    function loadFull() { var d = load(); d.candidates = d.candidates || []; return d; }
    function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
    function snapshot(d) { d.serverTime = new Date().toISOString(); return Promise.resolve(JSON.parse(JSON.stringify(d))); }
    return {
      getData: function () { return snapshot(loadFull()); },
      saveItem: function (type, item) {
        var d = loadFull();
        item.id = item.id || ('m' + Date.now() + Math.random().toString(16).slice(2, 6));
        item.updatedAt = new Date().toISOString();
        var i = d[type].findIndex(function (x) { return x.id === item.id; });
        if (type === 'candidates') {
          var old = d.candidates.find(function (x) { return x.id === item.id; });
          item.votes = old ? old.votes : '{}';
          item.createdAt = old ? old.createdAt : item.updatedAt;
        }
        if (i >= 0) d[type][i] = item; else d[type].push(item);
        save(d); return snapshot(d);
      },
      deleteItem: function (type, id) {
        var d = loadFull();
        d[type] = d[type].filter(function (x) { return x.id !== id; });
        save(d); return snapshot(d);
      },
      saveSettings: function (s) {
        var d = loadFull();
        Object.keys(s).forEach(function (k) { d.settings[k] = String(s[k]); });
        save(d); return snapshot(d);
      },
      vote: function (id, name, v) {
        var d = loadFull();
        var c = d.candidates.find(function (x) { return x.id === id; });
        if (!c) return Promise.reject(new Error('這個候選項目已被刪除或排入行程'));
        var votes = JSON.parse(c.votes || '{}');
        if (v === 0) delete votes[name]; else votes[name] = v;
        c.votes = JSON.stringify(votes);
        save(d); return snapshot(d);
      },
      scheduleCandidate: function (id, ev) {
        var d = loadFull();
        ev.id = 'm' + Date.now(); ev.updatedAt = new Date().toISOString();
        d.itinerary.push(ev);
        d.candidates = d.candidates.filter(function (x) { return x.id !== id; });
        save(d); return snapshot(d);
      }
    };
  }

  /* ---------- 工具 ---------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function members() {
    return String(state.settings.members || '').split(/[,，、]/).map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function getMe() { try { return localStorage.getItem('trip-me') || ''; } catch (e) { return ''; } }
  function setMe(v) { try { localStorage.setItem('trip-me', v); } catch (e) {} }
  function parseDate(s) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || '').trim());
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function fmtISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtShort(s) {
    var d = parseDate(s);
    return d ? (d.getMonth() + 1) + '/' + d.getDate() + '（' + WEEK[d.getDay()] + '）' : s;
  }
  function money(n) {
    var v = Math.round(Number(n || 0) * 100) / 100;
    return (state.settings.currency ? state.settings.currency + ' ' : '') + v.toLocaleString('zh-TW', { maximumFractionDigits: 2 });
  }
  function catOf(key) { return CATEGORIES.find(function (c) { return c.key === key; }) || CATEGORIES[4]; }
  function initial(name) { return esc(String(name || '?').trim().charAt(0) || '?'); }
  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ---------- 資料同步 ---------- */
  function applyData(d) {
    state.settings = d.settings || {};
    state.itinerary = d.itinerary || [];
    state.expenses = d.expenses || [];
    state.candidates = d.candidates || [];
    var now = new Date();
    $('#syncText').textContent = '已同步 ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    $('#loading').classList.add('hidden');
    render();
  }
  function refresh(silent) {
    if (state.busy) return Promise.resolve();
    if (!silent) $('#syncText').textContent = '同步中…';
    return api.getData().then(applyData).catch(function (e) {
      $('#syncText').textContent = '同步失敗';
      if (!silent) toast('讀取失敗：' + (e && e.message ? e.message : e));
    });
  }
  function mutate(promise, okMsg) {
    state.busy = true;
    $('#syncText').textContent = '儲存中…';
    return promise.then(function (d) {
      state.busy = false; applyData(d); if (okMsg) toast(okMsg);
    }).catch(function (e) {
      state.busy = false; $('#syncText').textContent = '儲存失敗';
      toast('儲存失敗：' + (e && e.message ? e.message : e));

  /* ---------- 畫面 ---------- */
  function render() {

      datesText = fmtShort(s.startDate) + ' – ' + fmtShort(s.endDate) + '　共 ' + days + ' 天';
      var left = Math.ceil((sd - new Date(new Date().toDateString())) / 86400000);
      if (left > 0) datesText += '　・倒數 ' + left + ' 天';

    var sel = $('#meSelect');
    sel.innerHTML = '<option value="">（選擇）</option>' + ms.map(function (m) {
      return '<option' + (m === me ? ' selected' : '') + '>' + esc(m) + '</option>';

  function renderItinerary() {
    var s = state.settings;
    var groups = {};
    var sd = parseDate(s.startDate), ed = parseDate(s.endDate);
    if (sd && ed && ed >= sd && (ed - sd) / 86400000 < 120) {
      for (var d = new Date(sd); d <= ed; d.setDate(d.getDate() + 1)) groups[fmtISO(d)] = [];
    }
    state.itinerary.forEach(function (it) {
      var key = parseDate(it.date) ? fmtISO(parseDate(it.date)) : '';
      (groups[key] = groups[key] || []).push(it);
    });
    var keys = Object.keys(groups).filter(function (k) { return k; }).sort();
    if (groups['']) keys.push('');

    var html = '<div class="section-title"><h2>行程時間軸</h2><span class="hint">點卡片可編輯</span></div>';
    if (!keys.length) {
      html += '<div class="empty">還沒有任何行程<br>按右下角 ＋ 新增第一個吧！</div>';
    }
    keys.forEach(function (k) {
      var items = groups[k].slice().sort(function (a, b) {
        return (a.time || '99:99').localeCompare(b.time || '99:99');
      });
      var dayNo = '';
      if (k && sd) {
        var n = Math.round((parseDate(k) - sd) / 86400000) + 1;
        if (n >= 1) dayNo = 'Day ' + n;
      }
      html += '<div class="day"><div class="day-head">' +
        (dayNo ? '<span class="day-badge">' + dayNo + '</span>' : '') +
        '<span class="day-date">' + (k ? esc(fmtShort(k)) : '日期未定') + '</span>' +
        '<span class="day-count">' + items.length + ' 項</span>' +
        routeLink(items) +
        '<button class="day-add" type="button" data-add-date="' + esc(k) + '">＋</button></div>';
      if (items.length) {
        html += '<div class="tl">' + items.map(renderEvent).join('') + '</div>';
      }
      html += '</div>';
    });
    $('#view-itinerary').innerHTML = html;
  }

  /* 單日路線：把當天有地點的行程依時間串成 Google 地圖路線 */
  var MAX_ROUTE_STOPS = 10;
  function routeLink(items) {
    var stops = items.map(function (it) { return String(it.location || '').trim(); }).filter(Boolean)
      .filter(function (loc, i, arr) { return i === 0 || loc !== arr[i - 1]; });
    if (!stops.length) return '';
    var url;
    if (stops.length === 1) {
      url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(stops[0]);
    } else {
      stops = stops.slice(0, MAX_ROUTE_STOPS);
      url = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(stops[0]) +
        '&destination=' + encodeURIComponent(stops[stops.length - 1]) +
        (stops.length > 2 ? '&waypoints=' + encodeURIComponent(stops.slice(1, -1).join('|')) : '');
    }
    return '<a class="day-route" href="' + esc(url) + '" target="_blank" rel="noopener" title="依時間順序在 Google 地圖開啟當天路線">🗺️ ' +
      (stops.length > 1 ? '路線' : '地圖') + '</a>';
  }

    return '<div class="ev' + (tentative ? ' tentative' : '') + '" style="--cat:' + c.color + '">' +
      '<div class="ev-time">' + (it.time ? esc(it.time) : '—') + (it.endTime ? '<small>~' + esc(it.endTime) + '</small>' : '') + '</div>' +

      '<div class="ev-card" data-edit-ev="' + esc(it.id) + '">' +

        '<span class="chip cat">' + c.label + '</span>' + (tentative ? '<span class="chip tent">待確認</span>' : '') + '</div>' +
        loc +

  function parseVotes(c) {
    try { return JSON.parse(c.votes || '{}') || {}; } catch (e) { return {}; }
  }
  function voteSummary(c) {
    var v = parseVotes(c), up = [], down = [];
    Object.keys(v).forEach(function (n) { if (v[n] > 0) up.push(n); else if (v[n] < 0) down.push(n); });
    return { up: up, down: down, score: up.length - down.length, mine: v[getMe()] || 0 };
  }

        (c.icon ? c.icon + ' ' : '') + c.label + ' ' + n + '</button>';

    }
    html += list.map(function (x, idx) {
      var c = x.c, v = x.v, cat = catOf(c.category);
      var loc = c.location ? '<div class="ev-loc">📍 <a href="https://www.google.com/maps/search/?api=1&query=' +
        encodeURIComponent(c.location) + '" target="_blank" rel="noopener">' + esc(c.location) + '</a></div>' : '';
      var link = /^https?:\/\//i.test(c.link || '') ? '<div class="cand-link">🔗 <a href="' + esc(c.link) + '" target="_blank" rel="noopener">參考連結</a></div>' : '';
      var voters = (v.up.length ? '👍 ' + v.up.map(esc).join('、') : '') + (v.up.length && v.down.length ? '　' : '') +
        (v.down.length ? '👎 ' + v.down.map(esc).join('、') : '');
      return '<div class="cand" style="--cat:' + cat.color + '">' +
        '<div class="ev-top"><div class="ev-title">' + (state.candFilter === 'all' && v.score > 0 && idx < 3 ? '<span class="cand-rank">#' + (idx + 1) + '</span>' : '') +
        cat.icon + ' ' + esc(c.title) + '</div><span class="chip cat">' + cat.label + '</span></div>' +
        loc + link +

        (c.author ? '<div class="ev-meta">' + esc(c.author) + ' 提議</div>' : '') +
        '<div class="cand-foot">' +
          '<button type="button" class="vote up' + (v.mine > 0 ? ' on' : '') + '" data-vote="1" data-cid="' + esc(c.id) + '">👍 ' + v.up.length + '</button>' +
          '<button type="button" class="vote down' + (v.mine < 0 ? ' on' : '') + '" data-vote="-1" data-cid="' + esc(c.id) + '">👎 ' + v.down.length + '</button>' +
          '<span class="voters">' + voters + '</span>' +

    $('#view-candidates').innerHTML = html;

  function castVote(id, value) {
    var me = getMe();
    if (!me) { toast('請先在上方「我是」選你的名字'); return; }
    var c = state.candidates.find(function (x) { return x.id === id; });
    if (!c) return;
    var current = parseVotes(c)[me] || 0;
    var next = current === value ? 0 : value;
    // 先在畫面上更新，讓按鈕即時反應
    var v = parseVotes(c);
    if (next === 0) delete v[me]; else v[me] = next;
    c.votes = JSON.stringify(v);
    renderCandidates();
    mutate(api.vote(id, me, next)).catch(function () { refresh(true); });
  }

  function computeBalances() {
    var ms = members();
    var people = {};
    function ensure(n) { if (!people[n]) people[n] = { paid: 0, share: 0 }; return people[n]; }
    ms.forEach(ensure);
    var total = 0;
    state.expenses.forEach(function (e) {
      var amt = Number(e.amount) || 0;
      if (!amt) return;
      total += amt;
      var split = String(e.splitAmong || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      if (!split.length) split = ms.slice();
      if (!split.length) return;
      if (e.payer) ensure(e.payer).paid += amt;
      split.forEach(function (n) { ensure(n).share += amt / split.length; });
    });
    var names = Object.keys(people);
    names.forEach(function (n) { people[n].balance = people[n].paid - people[n].share; });

    // 最少轉帳次數的結算建議（貪婪法）
    var cred = names.filter(function (n) { return people[n].balance > 0.005; })
      .map(function (n) { return { n: n, v: people[n].balance }; }).sort(function (a, b) { return b.v - a.v; });
    var debt = names.filter(function (n) { return people[n].balance < -0.005; })
      .map(function (n) { return { n: n, v: -people[n].balance }; }).sort(function (a, b) { return b.v - a.v; });
    var transfers = [], i = 0, j = 0;
    while (i < debt.length && j < cred.length) {
      var x = Math.min(debt[i].v, cred[j].v);
      if (x > 0.005) transfers.push({ from: debt[i].n, to: cred[j].n, amount: x });
      debt[i].v -= x; cred[j].v -= x;
      if (debt[i].v < 0.005) i++;
      if (cred[j].v < 0.005) j++;
    }
    return { total: total, people: people, names: names, transfers: transfers };
  }

  function renderExpenses() {
    var b = computeBalances();
    var me = getMe();
    var html = '<div class="section-title"><h2>預算分攤</h2><span class="hint">' + state.expenses.length + ' 筆支出</span></div>';
    html += '<div class="stats">' +
      '<div class="stat"><div class="label">總支出</div><div class="value">' + esc(money(b.total)) + '</div></div>' +
      '<div class="stat"><div class="label">' + (me && b.people[me] ? esc(me) + ' 的結餘' : '平均每人') + '</div><div class="value' +
        (me && b.people[me] ? (b.people[me].balance >= 0 ? ' pos' : ' neg') : '') + '">' +
        esc(me && b.people[me] ? money(b.people[me].balance) : money(b.names.length ? b.total / b.names.length : 0)) + '</div></div>' +
      '</div>';

    html += '<div class="card"><h3>👥 每人明細</h3><table class="people"><thead><tr><th>成員</th><th>已付</th><th>應付</th><th>結餘</th></tr></thead><tbody>' +
      b.names.map(function (n) {
        var p = b.people[n];
        var cls = p.balance > 0.005 ? 'pos' : (p.balance < -0.005 ? 'neg' : '');
        return '<tr><td>' + esc(n) + '</td><td>' + esc(money(p.paid)) + '</td><td>' + esc(money(p.share)) + '</td><td class="' + cls + '">' +
          (p.balance > 0.005 ? '+' : '') + esc(money(p.balance)) + '</td></tr>';
      }).join('') + '</tbody></table><div class="help">結餘為正＝別人要還你；為負＝你要付給別人</div></div>';

    html += '<div class="card"><h3>🔁 結算建議</h3>' + (b.transfers.length ? b.transfers.map(function (t) {
      return '<div class="settle"><span class="avatar">' + initial(t.from) + '</span>' + esc(t.from) +
        '<span class="arrow">→</span><span class="avatar">' + initial(t.to) + '</span>' + esc(t.to) +
        '<span class="amt">' + esc(money(t.amount)) + '</span></div>';
    }).join('') : '<div class="help">目前帳目已平衡，不需要轉帳 🎉</div>') + '</div>';

    var list = state.expenses.slice().sort(function (a, b2) {
      return (b2.date || '').localeCompare(a.date || '') || (b2.updatedAt || '').localeCompare(a.updatedAt || '');
    });
    html += '<div class="card"><h3>🧾 支出紀錄</h3>' + (list.length ? list.map(function (e) {
      var split = String(e.splitAmong || '').split(',').filter(Boolean);
      var splitText = (!split.length || split.length === members().length) ? '全員分攤' : split.join('、') + ' 分攤';
      return '<div class="exp" data-edit-exp="' + esc(e.id) + '"><span class="avatar">' + initial(e.payer) + '</span>' +
        '<div class="exp-main"><div class="exp-item">' + esc(e.item || '（未命名）') + '</div>' +
        '<div class="exp-sub">' + esc(e.payer || '?') + ' 先付・' + esc(splitText) + (e.date ? '・' + esc(fmtShort(e.date)) : '') + '</div>' +
        (e.note ? '<div class="exp-sub">' + esc(e.note) + '</div>' : '') + '</div>' +
        '<div class="exp-amt">' + esc(money(e.amount)) + '<small>每人 ' + esc(money((Number(e.amount) || 0) / Math.max(1, split.length || members().length))) + '</small></div></div>';
    }).join('') : '<div class="help">還沒有支出紀錄，按右下角 ＋ 記一筆</div>') + '</div>';

    $('#view-expenses').innerHTML = html;
  }

        return '<button type="button" data-cat="' + c.key + '" class="' + (c.key === (it.category || 'sight') ? 'on' : '') + '">' + c.icon + ' ' + c.label + '</button>';
      }).join('') + '</div></div>' +
      '<div class="field"><label>日期</label><input type="date" name="date" value="' + esc(it.date) + '"><div class="help">留空會放在「日期未定」</div></div>' +
      '<div class="row2"><div class="field"><label>開始時間</label><input type="time" name="time" value="' + esc(it.time) + '"></div>' +
      '<div class="field"><label>結束時間</label><input type="time" name="endTime" value="' + esc(it.endTime) + '"></div></div>' +
      '<div class="field"><label>地點</label><input name="location" maxlength="200" value="' + esc(it.location) + '" placeholder="會自動連到 Google 地圖"></div>' +
      '<div class="field"><label>備註</label><textarea name="note" maxlength="1000" placeholder="票價、預約編號、注意事項…">' + esc(it.note) + '</textarea></div>' +
      '<div class="field"><label>狀態</label><div class="seg" id="stSeg">' +
        '<button type="button" data-st="tentative" class="' + (it.status !== 'confirmed' ? 'on' : '') + '">🤔 待確認</button>' +
        '<button type="button" data-st="confirmed" class="' + (it.status === 'confirmed' ? 'on' : '') + '">✅ 已確定</button></div></div>' +
      '<div class="sheet-actions">' + (item ? '<button type="button" class="btn danger" id="delBtn">刪除</button>' : '') +
      '<span class="spacer"></span><button type="button" class="btn ghost" id="cancelBtn">取消</button>' +
      '<button type="submit" class="btn primary">儲存</button></div></form>';

    openModal(html, function (root) {
      var cat = it.category || 'sight', st = it.status === 'confirmed' ? 'confirmed' : 'tentative';
      bindSeg($('#catSeg', root), 'cat', function (v) { cat = v; });
      bindSeg($('#stSeg', root), 'st', function (v) { st = v; });
      $('#cancelBtn', root).onclick = closeModal;
      if (item) $('#delBtn', root).onclick = function () {
        if (!confirm('確定要刪除「' + item.title + '」？')) return;
        closeModal();
        mutate(api.deleteItem('itinerary', item.id), '已刪除');
      };
      $('#evForm', root).onsubmit = function (e) {
        e.preventDefault();
        var f = e.target;
        var data = {
          id: item ? item.id : '',
          title: f.title.value.trim(), category: cat, date: f.date.value, time: f.time.value, endTime: f.endTime.value,
          location: f.location.value.trim(), note: f.note.value.trim(), status: st, author: getMe()
        };
        if (!data.title) return;
        disableForm(f);
        var req = fromCandidate ? api.scheduleCandidate(fromCandidate.id, data) : api.saveItem('itinerary', data);
        mutate(req, fromCandidate ? '已排入行程 🎉' : '已儲存').then(closeModal, function () { enableForm(f); });
      };
    });
  }

  function openExpenseForm(item) {
    var ms = members();
    var e0 = item || { date: fmtISO(new Date()), payer: getMe() || ms[0] || '', splitAmong: ms.join(',') };
    var split = String(e0.splitAmong || '').split(',').filter(Boolean);
    if (!split.length) split = ms.slice();
    var payers = ms.slice();
    if (e0.payer && payers.indexOf(e0.payer) < 0) payers.push(e0.payer);

    var html = '<h3>' + (item ? '編輯支出' : '新增支出') + '</h3><form id="expForm">' +
      '<div class="field"><label>項目 *</label><input name="item" required maxlength="100" value="' + esc(e0.item) + '" placeholder="例如：機票、民宿、晚餐"></div>' +
      '<div class="row2"><div class="field"><label>金額（' + esc(state.settings.currency || '') + '）*</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="0" required value="' + esc(e0.amount) + '"></div>' +
      '<div class="field"><label>日期</label><input name="date" type="date" value="' + esc(e0.date) + '"></div></div>' +
      '<div class="field"><label>誰先付？</label><div class="seg" id="paySeg">' + payers.map(function (m) {
        return '<button type="button" data-p="' + esc(m) + '" class="' + (m === e0.payer ? 'on' : '') + '">' + esc(m) + '</button>';
      }).join('') + '</div></div>' +
      '<div class="field"><label>哪些人分攤？</label><div class="seg" id="splitSeg">' + ms.map(function (m) {
        return '<button type="button" data-s="' + esc(m) + '" class="' + (split.indexOf(m) >= 0 ? 'on' : '') + '">' + esc(m) + '</button>';
      }).join('') + '</div><div class="help" id="perHead"></div></div>' +
      '<div class="field"><label>備註</label><input name="note" maxlength="300" value="' + esc(e0.note) + '"></div>' +
      '<div class="sheet-actions">' + (item ? '<button type="button" class="btn danger" id="delBtn">刪除</button>' : '') +
      '<span class="spacer"></span><button type="button" class="btn ghost" id="cancelBtn">取消</button>' +
      '<button type="submit" class="btn primary">儲存</button></div></form>';

    openModal(html, function (root) {
      var payer = e0.payer;
      var chosen = split.filter(function (m) { return ms.indexOf(m) >= 0; });
      var f = $('#expForm', root);
      function updatePer() {
        var amt = Number(f.amount.value) || 0;
        $('#perHead', root).textContent = chosen.length ? chosen.length + ' 人分攤，每人 ' + money(amt / chosen.length) : '至少選一個人';
      }
      bindSeg($('#paySeg', root), 'p', function (v) { payer = v; });
      $('#splitSeg', root).addEventListener('click', function (ev) {
        var b = ev.target.closest('button'); if (!b) return;
        var n = b.dataset.s, i = chosen.indexOf(n);
        if (i >= 0) chosen.splice(i, 1); else chosen.push(n);
        b.classList.toggle('on', i < 0);
        updatePer();
      });
      f.amount.addEventListener('input', updatePer);
      updatePer();
      $('#cancelBtn', root).onclick = closeModal;
      if (item) $('#delBtn', root).onclick = function () {
        if (!confirm('確定要刪除「' + item.item + '」？')) return;
        closeModal();
        mutate(api.deleteItem('expenses', item.id), '已刪除');
      };
      f.onsubmit = function (ev) {
        ev.preventDefault();
        if (!payer) { toast('請選擇誰先付'); return; }
        if (!chosen.length) { toast('請至少選一位分攤的人'); return; }
        var ordered = ms.filter(function (m) { return chosen.indexOf(m) >= 0; });
        var data = {
          id: item ? item.id : '', item: f.item.value.trim(), amount: String(Number(f.amount.value) || 0),
          date: f.date.value, payer: payer, splitAmong: ordered.join(','), note: f.note.value.trim(), author: getMe()
        };
        disableForm(f);
        mutate(api.saveItem('expenses', data), '已儲存').then(closeModal, function () { enableForm(f); });
      };
    });
  }

  function bindSeg(el, attr, onChange) {
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      el.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      onChange(b.dataset[attr]);
    });
  }
  function disableForm(f) { f.querySelectorAll('button').forEach(function (b) { b.disabled = true; }); }
  function enableForm(f) { f.querySelectorAll('button').forEach(function (b) { b.disabled = false; }); }

  /* ---------- 事件 ---------- */
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  });
  $('#refreshBtn').addEventListener('click', function () { refresh(false); });
  $('#meSelect').addEventListener('change', function (e) { setMe(e.target.value); render(); });
  $('#fab').addEventListener('click', function () {
    if (state.tab === 'itinerary') openEventForm(null);
    else if (state.tab === 'candidates') openCandidateForm(null);
    else if (state.tab === 'expenses') {
      if (!members().length) { toast('請先到「設定」填寫成員'); return; }
      openExpenseForm(null);
    }
  });
  document.addEventListener('click', function (e) {
    var ev = e.target.closest('[data-edit-ev]');
    if (ev) {
      if (e.target.closest('a')) return;
      var it = state.itinerary.find(function (x) { return x.id === ev.dataset.editEv; });
      if (it) openEventForm(it);
      return;
    }
    var ex = e.target.closest('[data-edit-exp]');
    if (ex) {
      var item = state.expenses.find(function (x) { return x.id === ex.dataset.editExp; });
      if (item) openExpenseForm(item);
      return;
    }
    var add = e.target.closest('[data-add-date]');
    if (add) { openEventForm(null, add.dataset.addDate); return; }
    var vb = e.target.closest('[data-vote]');
    if (vb) { castVote(vb.dataset.cid, Number(vb.dataset.vote)); return; }
    var ec = e.target.closest('[data-edit-cand]');
    if (ec) {
      var cand = state.candidates.find(function (x) { return x.id === ec.dataset.editCand; });
      if (cand) openCandidateForm(cand);
      return;
    }
    var sc = e.target.closest('[data-schedule]');
    if (sc) {
      var c2 = state.candidates.find(function (x) { return x.id === sc.dataset.schedule; });
      if (c2) openEventForm(null, null, c2);
      return;
    }
    var fb = e.target.closest('[data-filter]');
    if (fb) { state.candFilter = fb.dataset.filter; renderCandidates(); }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'settingsForm') return;
    e.preventDefault();
    var f = e.target;
    if (f.startDate.value && f.endDate.value && f.endDate.value < f.startDate.value) { toast('回程日不能早於出發日'); return; }
    disableForm(f);
    mutate(api.saveSettings({
      tripName: f.tripName.value.trim(), startDate: f.startDate.value, endDate: f.endDate.value,
      members: f.members.value.split(/[,，、]/).map(function (s) { return s.trim(); }).filter(Boolean).join(','),
      currency: f.currency.value.trim().toUpperCase()
    }), '設定已儲存').catch(function () { enableForm(f); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.modalOpen) closeModal(); });

  setInterval(function () {
    if (!state.modalOpen && !document.hidden) refresh(true);
  }, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !state.modalOpen) refresh(true); });

  refresh(false);
})();
</script>
</body>
</html>
