        return '<button type="button" data-cat="' + c.key + '" class="' + (c.key === (it.category || 'sight') ? 'on' : '') + '">' + c.icon + ' ' + c.label + '</button>';
      }).join('') + '</div></div>' +
      '<div class="field"><label>日期</label><input type="date" name="date" value="' + esc(it.date) + '"><div class="help">留空會放在「日期未定」</div></div>' +
      '<div class="row2"><div class="field"><label>開始時間</label><input type="time" name="time" value="' + esc(it.time) + '"></div>' +
      '<div class="field"><label>結束時間</label><input type="time" name="endTime" value="' + esc(it.endTime) + '"></div></div>' +
      '<div class="field"><label>地點</label><input name="location" maxlength="200" value="' + esc(it.location) + '" placeholder="會自動連到 Google 地圖"></div>' +
      '<div class="field"><label>備註</label><textarea name="note" maxlength="1000" placeholder="票價、預約編號、注意事項…">' + esc(it.note) + '</textarea></div>' +
      imageFieldHtml(6) +
      '<div class="field"><label>狀態</label><div class="seg" id="stSeg">' +
        '<button type="button" data-st="tentative" class="' + (it.status !== 'confirmed' ? 'on' : '') + '">🤔 待確認</button>' +
        '<button type="button" data-st="confirmed" class="' + (it.status === 'confirmed' ? 'on' : '') + '">✅ 已確定</button></div></div>' +
      '<div class="sheet-actions">' + (item ? '<button type="button" class="btn danger" id="delBtn">刪除</button>' : '') +
      '<span class="spacer"></span><button type="button" class="btn ghost" id="cancelBtn">取消</button>' +
      '<button type="submit" class="btn primary">儲存</button></div></form>';

    openModal(html, function (root) {
      var cat = it.category || 'sight', st = it.status === 'confirmed' ? 'confirmed' : 'tentative';
      bindSeg($('#catSeg', root), 'cat', function (v) { cat = v; });
      bindSeg($('#stSeg', root), 'st', function (v) { st = v; });
      $('#cancelBtn', root).onclick = closeModal;
      if (item) $('#delBtn', root).onclick = function () {
        if (!confirm('確定要刪除「' + item.title + '」？')) return;
        closeModal();
        guarded(function (force) { return api.deleteItem('itinerary', item.id, opts(item, force)); }, '已刪除', 'delete');
      };
      var photos = mountImageField(root, parseImages(it), 6);
      $('#evForm', root).onsubmit = function (e) {
        e.preventDefault();
        var f = e.target;
        if (photos.busy()) { toast('照片還在上傳，請稍等'); return; }
        var data = {
          id: item ? item.id : '',
          title: f.title.value.trim(), category: cat, date: f.date.value, time: f.time.value, endTime: f.endTime.value,
          location: f.location.value.trim(), note: f.note.value.trim(), status: st, author: getMe(),
          images: JSON.stringify(photos.ids())
        };
        if (!data.title) return;
        disableForm(f);
        var movedIds = fromCandidate ? commentsFor('candidates', fromCandidate.id).map(function (c) { return c.id; }) : [];
        var seenBefore = fromCandidate ? seenMap()['candidates|' + fromCandidate.id] : '';
        var done = fromCandidate
          ? mutate(api.scheduleCandidate(fromCandidate.id, data, opts(null)), '已排入行程 🎉').then(function () {
              // 留言跟著搬到新行程，已讀狀態也一起帶過去
              var moved = state.comments.find(function (c) { return movedIds.indexOf(c.id) >= 0; });
              if (moved && seenBefore) {
                var m = seenMap(); m['itinerary|' + moved.targetId] = seenBefore;
                try { localStorage.setItem('trip-seen', JSON.stringify(m)); } catch (err) {}
                render();
              }
            })
          : guarded(function (force) { return api.saveItem('itinerary', data, opts(item, force)); }, '已儲存');
        done.then(function () { photos.commit(); closeModal(); }, function () { enableForm(f); });
      };
    });
  }

  function openExpenseForm(item) {
    var ms = members();
    var e0 = item || { date: fmtISO(new Date()), payer: getMe() || ms[0] || '', splitAmong: ms.join(',') };
    var split = String(e0.splitAmong || '').split(',').filter(Boolean);
    if (!split.length) split = ms.slice();
    var payers = ms.slice();
    if (e0.payer && payers.indexOf(e0.payer) < 0) payers.push(e0.payer);
    var curs = [baseCur()].concat(extraCurs());
    var lastCur = '';
    try { lastCur = localStorage.getItem('trip-last-cur') || ''; } catch (err) {}
    var cur0 = item ? curOf(item) : (curs.indexOf(lastCur) >= 0 ? lastCur : baseCur());
    if (curs.indexOf(cur0) < 0) curs.push(cur0);
    var rate0 = item && item.currency && item.currency !== baseCur() ? (Number(item.rate) || autoRate(cur0)) : autoRate(cur0);

    var html = '<h3>' + (item ? '編輯支出' : '新增支出') + '</h3><form id="expForm">' +
      '<div class="field"><label>項目 *</label><input name="item" required maxlength="100" value="' + esc(e0.item) + '" placeholder="例如：機票、民宿、晚餐"></div>' +
      (curs.length > 1 ? '<div class="field"><label>幣別</label><div class="seg" id="curSeg">' + curs.map(function (c) {
        return '<button type="button" data-cur="' + esc(c) + '" class="' + (c === cur0 ? 'on' : '') + '">' + esc(c) + '</button>';
      }).join('') + '</div></div>' : '') +
      '<div class="row2"><div class="field"><label>金額（<span id="curLabel">' + esc(cur0) + '</span>）*</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="0" required value="' + esc(e0.amount) + '"></div>' +
      '<div class="field"><label>日期</label><input name="date" type="date" value="' + esc(e0.date) + '"></div></div>' +
      '<div class="field" id="rateField"><label>匯率：1 <span class="rc"></span> = ? ' + esc(baseCur()) + '</label>' +
        '<input name="rate" type="number" inputmode="decimal" step="any" min="0" value="' + (rate0 ? esc(rate0) : '') + '">' +
        '<div class="help" id="rateHelp"></div></div>' +
      '<div class="field"><label>誰先付？</label><div class="seg" id="paySeg">' + payers.map(function (m) {
        return '<button type="button" data-p="' + esc(m) + '" class="' + (m === e0.payer ? 'on' : '') + '">' + esc(m) + '</button>';
      }).join('') + '</div></div>' +
      '<div class="field"><label>哪些人分攤？</label><div class="seg" id="splitSeg">' + ms.map(function (m) {
        return '<button type="button" data-s="' + esc(m) + '" class="' + (split.indexOf(m) >= 0 ? 'on' : '') + '">' + esc(m) + '</button>';
      }).join('') + '</div><div class="help" id="perHead"></div></div>' +
      '<div class="field"><label>備註</label><input name="note" maxlength="300" value="' + esc(e0.note) + '"></div>' +
      '<div class="sheet-actions">' + (item ? '<button type="button" class="btn danger" id="delBtn">刪除</button>' : '') +
      '<span class="spacer"></span><button type="button" class="btn ghost" id="cancelBtn">取消</button>' +
      '<button type="submit" class="btn primary">儲存</button></div></form>';

    openModal(html, function (root) {
      var payer = e0.payer;
      var chosen = split.filter(function (m) { return ms.indexOf(m) >= 0; });
      var f = $('#expForm', root);
      var cur = cur0;
      function currentRate() { return cur === baseCur() ? 1 : (Number(f.rate.value) || 0); }
      function updatePer() {
        var amt = (Number(f.amount.value) || 0) * currentRate();
        $('#perHead', root).textContent = chosen.length ? chosen.length + ' 人分攤，每人 ' + money(amt / chosen.length) : '至少選一個人';
        if (cur !== baseCur()) {
          var ar = autoRate(cur);
          $('#rateHelp', root).innerHTML = (Number(f.amount.value) && currentRate() ? '≈ ' + esc(money(amt)) + '　' : '') +
            (ar ? '今日自動匯率 ' + esc(fmtRate(ar)) + (Number(f.rate.value) !== ar ? '　<a href="#" id="useAuto">套用</a>' : '') : '抓不到自動匯率，請手動輸入') +
            '<br>刷卡的話可以改成帳單上的實際匯率';
        }
      }
      function updateCur() {
        $('#curLabel', root).textContent = cur;
        $('#rateField', root).style.display = cur === baseCur() ? 'none' : '';
        $('.rc', root).textContent = cur;
        updatePer();
      }
      if ($('#curSeg', root)) bindSeg($('#curSeg', root), 'cur', function (v) {
        cur = v;
        f.rate.value = v === baseCur() ? '' : (item && item.currency === v && Number(item.rate) ? item.rate : (autoRate(v) || ''));
        updateCur();
      });
      f.rate.addEventListener('input', updatePer);
      $('#rateHelp', root).addEventListener('click', function (ev) {
        if (ev.target.id !== 'useAuto') return;
        ev.preventDefault(); f.rate.value = autoRate(cur); updatePer();
      });
      updateCur();
      bindSeg($('#paySeg', root), 'p', function (v) { payer = v; });
      $('#splitSeg', root).addEventListener('click', function (ev) {
        var b = ev.target.closest('button'); if (!b) return;
        var n = b.dataset.s, i = chosen.indexOf(n);
        if (i >= 0) chosen.splice(i, 1); else chosen.push(n);
        b.classList.toggle('on', i < 0);
        updatePer();
      });
      f.amount.addEventListener('input', updatePer);
      $('#cancelBtn', root).onclick = closeModal;
      if (item) $('#delBtn', root).onclick = function () {
        if (!confirm('確定要刪除「' + item.item + '」？')) return;
        closeModal();
        guarded(function (force) { return api.deleteItem('expenses', item.id, opts(item, force)); }, '已刪除', 'delete');
      };
      f.onsubmit = function (ev) {
        ev.preventDefault();
        if (!payer) { toast('請選擇誰先付'); return; }
        if (!chosen.length) { toast('請至少選一位分攤的人'); return; }
        if (cur !== baseCur() && !(Number(f.rate.value) > 0)) { toast('請輸入匯率'); return; }
        try { localStorage.setItem('trip-last-cur', cur); } catch (err) {}
        var ordered = ms.filter(function (m) { return chosen.indexOf(m) >= 0; });
        var data = {
          id: item ? item.id : '', item: f.item.value.trim(), amount: String(Number(f.amount.value) || 0),
          date: f.date.value, payer: payer, splitAmong: ordered.join(','), note: f.note.value.trim(), author: getMe(),
          currency: cur, rate: cur === baseCur() ? '1' : String(Number(f.rate.value))
        };
        disableForm(f);
        guarded(function (force) { return api.saveItem('expenses', data, opts(item, force)); }, '已儲存')
          .then(closeModal, function () { enableForm(f); });
      };
    });
  }

  /* ---------- 修改紀錄與復原 ---------- */
  var FIELD_LABELS = {
    date: '日期', time: '開始時間', endTime: '結束時間', title: '名稱', category: '類型', location: '地點', note: '備註',
    status: '狀態', item: '項目', amount: '金額', payer: '付款人', splitAmong: '分攤的人', currency: '幣別', rate: '匯率',
    link: '連結', images: '照片', text: '留言內容', scope: '行李類型', owner: '負責人', dueDate: '期限',
    tripName: '旅行名稱', startDate: '出發日', endDate: '回程日', members: '成員', extraCurrencies: '外幣'
  };
  var IGNORE_FIELDS = ['id', 'updatedAt', 'createdAt', 'author', 'votes', 'checkedBy', 'done', 'kind'];
  function fieldValue(k, v) {
    if (v == null || v === '') return '（空）';
    if (k === 'category') return catOf(v).label;
    if (k === 'status') return v === 'confirmed' ? '已確定' : '待確認';
    if (k === 'scope') return v === 'personal' ? '每人都要帶' : '共用';
    if (k === 'images') { var n = parseImages({ images: v }).length; return n ? n + ' 張' : '無'; }
    if (k === 'date' || k === 'dueDate' || k === 'startDate' || k === 'endDate') return fmtShort(v);
    v = String(v);
    return v.length > 40 ? v.slice(0, 40) + '…' : v;
  }
  function diffLines(entry) {
    var lines = [];
    (entry.changes || []).forEach(function (c) {
      if (!c.before || !c.after) return;
      Object.keys(FIELD_LABELS).forEach(function (k) {
        if (IGNORE_FIELDS.indexOf(k) >= 0) return;
        if (!(k in c.before) && !(k in c.after)) return;
        var a = c.before[k] == null ? '' : String(c.before[k]);
        var b = c.after[k] == null ? '' : String(c.after[k]);
        if (k === 'images') { a = JSON.stringify(parseImages({ images: a })); b = JSON.stringify(parseImages({ images: b })); }
        if (a !== b) lines.push('<li>' + esc(FIELD_LABELS[k]) + '：' + esc(fieldValue(k, a)) + ' → <b>' + esc(fieldValue(k, b)) + '</b></li>');
      });
    });
    if (lines.length > 6) lines = lines.slice(0, 6).concat(['<li>…</li>']);
    return lines.join('');
  }

  function openHistory() {
    openModal('<h3>🕘 修改紀錄</h3>' +
      '<div class="help" style="margin:-8px 0 8px">每次新增、修改、刪除都會記錄；按「復原」可以還原成修改前的樣子（投票和勾選不列入）。</div>' +
      '<div id="histList"><div class="loading" style="padding:30px 0">載入中…</div></div>' +
      '<div class="sheet-actions"><span class="spacer"></span><button type="button" class="btn ghost" id="cancelBtn">關閉</button></div>',
      function (root) {
        $('#cancelBtn', root).onclick = closeModal;
        $('#histList', root).addEventListener('click', function (e) {
          var b = e.target.closest('[data-undo]');
          if (b) doUndo(b.dataset.undo, b.dataset.sum, root);
        });
        loadHistory(root);
      });
  }
  function loadHistory(root) {
    api.getLog(80).then(function (list) {
      var box = $('#histList', root);
      if (!box) return;
      if (!list.length) { box.innerHTML = '<div class="help" style="padding:20px 0;text-align:center">還沒有任何紀錄</div>'; return; }
      var lastDay = '';
      box.innerHTML = list.map(function (en) {
        var d = new Date(en.time), day = isNaN(d) ? '' : fmtShort(fmtISO(d));
        var head = day !== lastDay ? '<div class="hist-day">' + esc(day) + '</div>' : '';
        lastDay = day;
        var t = isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        return head + '<div class="hist' + (en.undoneBy ? ' undone' : '') + '"><span class="avatar">' + initial(en.actor || '?') + '</span>' +
          '<div class="hist-main"><div class="hist-sum">' + esc(en.summary) + '</div>' +
          '<div class="hist-meta">' + esc(en.actor || '（沒選名字）') + '・' + t + (en.undoneBy ? '・已復原' : '') + '</div>' +
          '<ul class="hist-diff">' + diffLines(en) + '</ul></div>' +
          (en.undoneBy ? '' : '<button type="button" class="undo-btn" data-undo="' + esc(en.id) + '" data-sum="' + esc(en.summary) + '">↩ 復原</button>') +
          '</div>';
      }).join('');
    }).catch(function (e) {
      var box = $('#histList', root);
      if (box) box.innerHTML = '<div class="help">讀取失敗：' + esc(errMsg(e)) + '</div>';
    });
  }
  function doUndo(id, summary, root) {
    if (!confirm('確定要復原「' + summary + '」嗎？')) return;
    root.querySelectorAll('.undo-btn').forEach(function (b) { b.disabled = true; });
    guarded(function (force) { return api.undo(id, { actor: getMe(), force: force }); }, '已復原')
      .then(function () { loadHistory(root); }, function () { loadHistory(root); });
  }

  function bindSeg(el, attr, onChange) {
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      el.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      onChange(b.dataset[attr]);
    });
  }
  function disableForm(f) { f.querySelectorAll('button').forEach(function (b) { b.disabled = true; }); }
  function enableForm(f) { f.querySelectorAll('button').forEach(function (b) { b.disabled = false; }); }

  /* ---------- 事件 ---------- */
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  });
  $('#refreshBtn').addEventListener('click', function () { refresh(false); });
  $('#histBtn').addEventListener('click', openHistory);
  $('#meSelect').addEventListener('change', function (e) { setMe(e.target.value); render(); });
  $('#fab').addEventListener('click', function () {
    if (state.tab === 'itinerary') openEventForm(null);
    else if (state.tab === 'candidates') openCandidateForm(null);
    else if (state.tab === 'checklist') openChecklistForm(null);
    else if (state.tab === 'expenses') {
      if (!members().length) { toast('請先到「設定」填寫成員'); return; }
      openExpenseForm(null);
    }
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('#pdfBtn')) { openPdfPanel(); return; }
    var cb = e.target.closest('[data-comments]');
    if (cb) {
      var cp = cb.dataset.comments.split('|');
      openComments(cp[0], cp[1]);
      return;
    }
    var vw = e.target.closest('[data-view]');
    if (vw) {
      var parts = vw.dataset.view.split('|');
      openViewer(parts[0], parts[1], Number(parts[2]) || 0);
      return;
    }
    var ev = e.target.closest('[data-edit-ev]');
    if (ev) {
      if (e.target.closest('a')) return;
      var it = state.itinerary.find(function (x) { return x.id === ev.dataset.editEv; });
      if (it) openEventForm(it);
      return;
    }
    var ex = e.target.closest('[data-edit-exp]');
    if (ex) {
      var item = state.expenses.find(function (x) { return x.id === ex.dataset.editExp; });
      if (item) openExpenseForm(item);
      return;
    }
    var add = e.target.closest('[data-add-date]');
    if (add) { openEventForm(null, add.dataset.addDate); return; }
    var vb = e.target.closest('[data-vote]');
    if (vb) { castVote(vb.dataset.cid, Number(vb.dataset.vote)); return; }
    var ec = e.target.closest('[data-edit-cand]');
    if (ec) {
      var cand = state.candidates.find(function (x) { return x.id === ec.dataset.editCand; });
      if (cand) openCandidateForm(cand);
      return;
    }
    var sc = e.target.closest('[data-schedule]');
    if (sc) {
      var c2 = state.candidates.find(function (x) { return x.id === sc.dataset.schedule; });
      if (c2) openEventForm(null, null, c2);
      return;
    }
    var ck = e.target.closest('[data-check]');
    if (ck) { toggleItem(ck.dataset.check); return; }
    var ek = e.target.closest('[data-edit-chk]');
    if (ek) {
      var ci = state.checklist.find(function (x) { return x.id === ek.dataset.editChk; });
      if (ci) openChecklistForm(ci);
      return;
    }
    var lv = e.target.closest('[data-listview]');
    if (lv) { state.listView = lv.dataset.listview; renderChecklist(); return; }
    if (e.target.id === 'importSuggest') { e.target.disabled = true; importSuggestions(); return; }
    var fb = e.target.closest('[data-filter]');
    if (fb) { state.candFilter = fb.dataset.filter; renderCandidates(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'mineOnly') { state.listMine = e.target.checked; renderChecklist(); }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'settingsForm') return;
    e.preventDefault();
    var f = e.target;
    if (f.startDate.value && f.endDate.value && f.endDate.value < f.startDate.value) { toast('回程日不能早於出發日'); return; }
    disableForm(f);
    mutate(api.saveSettings({
      tripName: f.tripName.value.trim(), startDate: f.startDate.value, endDate: f.endDate.value,
      members: f.members.value.split(/[,，、]/).map(function (s) { return s.trim(); }).filter(Boolean).join(','),
      currency: f.currency.value.trim().toUpperCase() || 'TWD',
      extraCurrencies: f.extraCurrencies.value.toUpperCase().split(/[^A-Z]+/).filter(function (c) { return /^[A-Z]{3}$/.test(c); }).join(',')
    }, opts(null)), '設定已儲存').catch(function () { enableForm(f); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.modalOpen) closeModal(); });

  setInterval(function () {
    if (!state.modalOpen && !document.hidden) refresh(true);
  }, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !state.modalOpen) refresh(true); });

  refresh(false);
})();
</script>
</body>
</html>
